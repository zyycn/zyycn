<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img">
  <title>Zyy — AI infrastructure, routed in Rust</title>
  <desc>Profile banner for an open-source developer building Rust gateways and AI infrastructure.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="1" opacity="0.18"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="428" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="#0d1117"/>
    <rect width="1200" height="430" fill="url(#grid)"/>
    <rect x="706" y="0" width="494" height="430" fill="#111820"/>
    <path d="M706 0V430" stroke="#30363d"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <rect x="58" y="57" width="10" height="10" rx="2" fill="#f0883e"/>
      <text x="82" y="67" fill="#8b949e" font-size="15" letter-spacing="2.2">ZYYCN / OPEN-SOURCE SYSTEMS</text>
    </g>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="54" letter-spacing="-1.8">
      <text x="58" y="148" fill="#f0f6fc">AI infrastructure,</text>
      <text x="58" y="210" fill="#f0f6fc">routed in <tspan fill="#f0883e">Rust.</tspan></text>
    </g>

    <text x="58" y="263" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">
      Self-hosted gateways and developer tools built for
    </text>
    <text x="58" y="290" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">
      control, clarity, and speed.
    </text>

    <g transform="translate(58 334)">
      <rect width="364" height="52" rx="11" fill="#161b22" stroke="#30363d"/>
      <circle cx="24" cy="26" r="5" fill="#f0883e"/>
      <text x="42" y="23" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600">codex-proxy-rs</text>
      <text x="42" y="39" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="0.5">FLAGSHIP PROJECT</text>
      <text x="335" y="32" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">→</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="750" y="66" fill="#8b949e" font-size="13" letter-spacing="1.8">REQUEST ROUTE</text>
      <text x="1126" y="66" fill="#8b949e" font-size="12" text-anchor="end">BEIJING / WANGJING</text>

      <g transform="translate(750 100)">
        <rect width="390" height="248" rx="16" fill="#0d1117" stroke="#30363d"/>
        <text x="24" y="37" fill="#8b949e" font-size="12">POST</text>
        <text x="68" y="37" fill="#f0f6fc" font-size="12">/v1/responses</text>
        <circle cx="350" cy="33" r="4" fill="#f0883e"/>
        <text x="338" y="37" fill="#8b949e" font-size="10" text-anchor="end">STREAM</text>
        <path d="M24 56H366" stroke="#30363d"/>

        <circle cx="42" cy="106" r="8" fill="#8b949e"/>
        <text x="24" y="135" fill="#8b949e" font-size="11">CLIENT</text>
        <path d="M54 106H118" stroke="#f0883e" stroke-width="2"/>
        <path d="M110 100L118 106L110 112" fill="none" stroke="#f0883e" stroke-width="2"/>

        <rect x="123" y="77" width="126" height="58" rx="10" fill="#3b251a" stroke="#f0883e"/>
        <text x="186" y="101" fill="#f0f6fc" font-size="12" text-anchor="middle" font-weight="700">gateway.rs</text>
        <text x="186" y="119" fill="#f0883e" font-size="10" text-anchor="middle">ROUTE / POOL</text>

        <path d="M249 106H282C298 106 298 82 314 82H334" fill="none" stroke="#8b949e" stroke-width="1.5"/>
        <path d="M249 106H282C298 106 298 130 314 130H334" fill="none" stroke="#8b949e" stroke-width="1.5"/>
        <circle cx="342" cy="82" r="8" fill="#f0f6fc"/>
        <circle cx="342" cy="130" r="8" fill="#f0f6fc"/>
        <text x="318" y="70" fill="#8b949e" font-size="10">CODEX</text>
        <text x="296" y="155" fill="#8b949e" font-size="10">ACCOUNT POOL</text>

        <path d="M342 171V190H42V156" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 5"/>
        <path d="M48 164L42 156L36 164" fill="none" stroke="#8b949e" stroke-width="1.5"/>
        <text x="159" y="213" fill="#8b949e" font-size="10" letter-spacing="1.2">STREAMED RESPONSE</text>
        <text x="24" y="231" fill="#f0883e" font-size="11">200</text>
        <text x="55" y="231" fill="#8b949e" font-size="11">CONTROLLED · OBSERVABLE · FAST</text>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="428" rx="22" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
